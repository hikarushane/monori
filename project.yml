name: Monori
options:
  bundleIdPrefix: dev.monori
  deploymentTarget:
    iOS: "17.0"
# Set explicitly: xcodegen 2.45.x no longer defaults these, and without them
# the generated project builds with an empty SWIFT_VERSION and an empty
# PRODUCT_NAME (".app"), which fails the build. It also no longer defines
# DEBUG for the Debug config, which silently compiles out every `#if DEBUG`
# feature (the smoke autopilot, the reader dismiss button, debug diagnostics).
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: "$(TARGET_NAME)"
    # Pin the signing team (hikarushane.dev@gmail.com). Without this, xcodegen
    # regeneration wipes the team picked in Xcode's Signing UI, and Xcode may
    # re-sign with a different Apple ID — the device then rejects the install
    # with MismatchedApplicationIdentifierEntitlement (team prefix changed).
    DEVELOPMENT_TEAM: X8MSQ726HU
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
packages:
  MonoriCore:
    path: MonoriCore
targets:
  Monori:
    type: application
    platform: iOS
    sources: [App]
    entitlements:
      path: App/Monori.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.dev.monori
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Monori
        NSCameraUsageDescription: "Allow camera access when you choose to take a photo on a website opened in Monori."
        # Pinned here because xcodegen regenerates App/Info.plist and would
        # otherwise reset these to its defaults (1.0 / 1). Bump CFBundleVersion
        # for every TestFlight upload — App Store Connect rejects a build number
        # it has already seen.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "7"
        UILaunchStoryboardName: LaunchScreen
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Manrope[wght].ttf
          - SourceSerif4Variable-Roman.ttf
          - NotoSerifTC-VF.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: MonoriCore
schemes:
  Monori:
    build:
      targets:
        Monori: all
