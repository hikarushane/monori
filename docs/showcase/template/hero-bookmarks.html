<!DOCTYPE html><html class="light" lang="zh-TW"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Monori - 隨時放下，隨時接續</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Source+Serif+4:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#121f0f",
                        "primary-container": "#a8b9a0",
                        "surface-container": "#f0eded",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "secondary-fixed-dim": "#c4c7c3",
                        "outline": "#747870",
                        "surface-variant": "#e4e2e1",
                        "surface-tint": "#53634e",
                        "inverse-on-surface": "#f3f0f0",
                        "on-background": "#1b1c1c",
                        "primary-fixed": "#d6e8cd",
                        "on-error": "#ffffff",
                        "tertiary-container": "#a9b9a1",
                        "tertiary": "#54624e",
                        "on-tertiary-fixed-variant": "#3d4b38",
                        "charcoal": "#333333",
                        "inverse-surface": "#303030",
                        "on-secondary-container": "#5e625e",
                        "on-tertiary": "#ffffff",
                        "sumi-ink": "#1A1A1A",
                        "primary": "#53634e",
                        "surface": "#fbf9f8",
                        "surface-bright": "#fbf9f8",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e4e2e1",
                        "error": "#ba1a1a",
                        "background": "#fbf9f8",
                        "secondary-container": "#dbded9",
                        "washi-white": "#F9F9F7",
                        "secondary-fixed": "#e0e3de",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#baccb2",
                        "on-primary-container": "#3b4a36",
                        "surface-container-low": "#f6f3f2",
                        "tertiary-fixed-dim": "#bbcbb3",
                        "uguisu-iro": "#A8B9A0",
                        "secondary": "#5b5f5c",
                        "outline-variant": "#c4c8bf",
                        "on-secondary-fixed": "#191c1a",
                        "on-primary-fixed-variant": "#3c4b37",
                        "primary-fixed-dim": "#baccb2",
                        "on-surface": "#1b1c1c",
                        "on-primary-fixed": "#111f0e",
                        "surface-container-high": "#eae8e7",
                        "on-secondary-fixed-variant": "#444844",
                        "on-surface-variant": "#444841",
                        "tertiary-fixed": "#d7e7ce",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#3c4a37",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "unit": "4px",
                        "reading-max-width": "680px",
                        "stack-lg": "2rem",
                        "stack-sm": "0.5rem",
                        "margin-page": "2rem",
                        "gutter-grid": "1.5rem"
                    },
                    "fontFamily": {
                        "display-lg": ["Manrope"],
                        "ui-body-md": ["Manrope"],
                        "display-lg-mobile": ["Manrope"],
                        "reading-body-lg": ["\"Source Serif 4\""],
                        "reading-body-md": ["\"Source Serif 4\""],
                        "headline-md": ["Manrope"],
                        "ui-label-sm": ["Manrope"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "ui-body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "reading-body-lg": ["20px", { "lineHeight": "34px", "fontWeight": "400" }],
                        "reading-body-md": ["18px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "ui-label-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-primary-container text-on-surface min-h-screen flex flex-col justify-between overflow-hidden antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Header Section -->
<header class="pt-16 md:pt-24 px-margin-page w-full max-w-[1200px] mx-auto z-10 relative">
<div class="flex flex-col md:flex-row items-start md:items-center gap-stack-lg md:gap-12">
<!-- Logo Icon (Abstract 3 bars) -->
<div class="flex items-end gap-1 mb-stack-md md:mb-0">
<div class="w-2 h-10 bg-charcoal rounded-[1px]"></div>
<div class="w-2 h-8 bg-charcoal rounded-[1px]"></div>
<div class="w-2 h-10 bg-charcoal rounded-[1px]"></div>
</div>
<div class="flex flex-col gap-2">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-charcoal">
                    隨時放下，隨時接續
                </h1>
<p class="font-reading-body-lg text-reading-body-lg text-on-surface-variant max-w-[500px]">
                    每一章都有獨立書籤，無論何時回來，故事都在原處。
                </p>
</div>
</div>
</header>
<!-- Main Visual Section -->
<main class="flex-grow relative flex justify-center items-end mt-12 px-margin-page">
<!-- Phone Frame Wrapper -->
<div class="relative w-[320px] md:w-[380px] h-[600px] md:h-[700px] bg-charcoal rounded-t-[40px] md:rounded-t-[50px] p-[6px] md:p-2 border-[4px] border-surface-container-low shadow-2xl shadow-charcoal/20 z-20 translate-y-12 transition-transform duration-700 ease-out hover:translate-y-8">
<!-- Screen Content -->
<div class="w-full h-full bg-washi-white rounded-t-[34px] md:rounded-t-[42px] overflow-hidden relative flex flex-col">
<!-- Dynamic Island Fake -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-[120px] h-[32px] bg-charcoal rounded-full z-50 flex items-center justify-between px-3">
<div class="w-3 h-3 rounded-full bg-surface-container-highest/20"></div>
<div class="w-3 h-3 rounded-full bg-surface-container-highest/20"></div>
</div>
<!-- Top App Bar (Simulated inside phone) -->
<div class="sticky top-0 z-40 bg-washi-white pt-14 pb-4 px-4 flex justify-between items-center shadow-[0_4px_24px_rgba(0,0,0,0.02)]">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-charcoal transition-colors hover:bg-surface-variant">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="font-headline-md text-headline-md text-charcoal tracking-wide">紙上幽靈</h2>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-charcoal transition-colors hover:bg-surface-variant">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
<!-- Chapter List -->
<div class="flex-grow overflow-y-auto px-4 pb-20">
<ul class="flex flex-col">
<!-- Item 1 -->
<li class="py-5 border-b border-charcoal/5 flex justify-between items-center group cursor-pointer transition-colors hover:bg-surface-container-low/50">
<span class="font-reading-body-md text-reading-body-md text-charcoal">1. 雜訊裡的訊號</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">bookmark_border</span>
</li>
<!-- Item 2 (Active/Bookmarked) -->
<li class="py-5 border-b border-charcoal/5 flex justify-between items-center bg-primary-fixed/20 px-2 -mx-2 rounded-lg cursor-pointer">
<span class="font-reading-body-md text-reading-body-md text-charcoal font-medium">2. 遺忘的製圖學</span>
<span class="material-symbols-outlined filled text-primary" style="font-variation-settings: 'FILL' 1;">bookmark</span>
</li>
<!-- Item 3 -->
<li class="py-5 border-b border-charcoal/5 flex justify-between items-center group cursor-pointer transition-colors hover:bg-surface-container-low/50">
<span class="font-reading-body-md text-reading-body-md text-charcoal">3. 沒有寄出的信</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">bookmark_border</span>
</li>
<!-- Item 4 -->
<li class="py-5 border-b border-charcoal/5 flex justify-between items-center group cursor-pointer transition-colors hover:bg-surface-container-low/50">
<span class="font-reading-body-md text-reading-body-md text-charcoal">4. 雨的幾何</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">bookmark_border</span>
</li>
<!-- Item 5 -->
<li class="py-5 flex justify-between items-center group cursor-pointer transition-colors hover:bg-surface-container-low/50">
<span class="font-reading-body-md text-reading-body-md text-charcoal">5. 出口的傷</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">bookmark_border</span>
</li>
</ul>
</div>
<!-- Subtle gradient overlay at bottom of screen to signify more content -->
<div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-washi-white to-transparent pointer-events-none"></div>
</div>
<!-- Side buttons decoration -->
<div class="absolute -left-[6px] top-32 w-1 h-12 bg-surface-container-highest rounded-l-md opacity-50"></div>
<div class="absolute -left-[6px] top-48 w-1 h-16 bg-surface-container-highest rounded-l-md opacity-50"></div>
<div class="absolute -left-[6px] top-68 w-1 h-16 bg-surface-container-highest rounded-l-md opacity-50"></div>
<div class="absolute -right-[6px] top-40 w-1 h-20 bg-surface-container-highest rounded-r-md opacity-50"></div>
</div>
<!-- Background Ambient Element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-tertiary-container/30 rounded-full blur-3xl -z-10 pointer-events-none"></div>
</main>
</body></html>
